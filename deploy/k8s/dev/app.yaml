# Manifest môi trường K8S dev. Job deploy-dev trong ci.yml thay __IMAGE__ bằng image develop-<sha> rồi kubectl apply.
# Image là bản build tĩnh (nginx :8080). Truy cập công khai chỉ qua API Gateway (Kong) tại
# https://taca.thanhtanengineer.id.vn — Service để ClusterIP, không mở NodePort.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-service
  labels: { app: web-service, part-of: taca }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: web-service }
  template:
    metadata:
      labels: { app: web-service, part-of: taca }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: __IMAGE__
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels: { app: web-service, part-of: taca }
spec:
  type: ClusterIP
  selector: { app: web-service }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
