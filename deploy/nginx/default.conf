# Phục vụ bản build tĩnh của Taca web (shell + remote) sau API Gateway / Cloudflare CDN.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Entry của remote không có hash trong tên → không cache, để deploy mới có hiệu lực ngay
    location ~ /remoteEntry\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # File đã có hash → cache lâu dài ở trình duyệt và Cloudflare edge
    location ~ ^(/remotes/[a-z]+)?/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Remote không phải SPA độc lập: file thiếu → 404, không fallback về shell
    location /remotes/ {
        try_files $uri =404;
    }

    # Shell SPA: route phía client → index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
